# Builds the Windows executable and attaches the zip to the release.
# Runs when a release is published (MAJOR/MINOR only; PATCH versions are
# tags without a release, so they are not built). Manual runs build and
# keep the zip as a workflow artifact.
name: Release build

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Check tag matches __version__
        if: github.event_name == 'release'
        shell: bash
        run: |
          v=$(python -c "import ocv; print(ocv.__version__)")
          if [ "v$v" != "${{ github.event.release.tag_name }}" ]; then
            echo "Tag ${{ github.event.release.tag_name }} != __version__ $v"
            exit 1
          fi

      - name: Tests
        run: python tests/run.py

      - name: Build, smoke test and package
        run: python build.py --smoke

      - name: Attach zip to release
        if: github.event_name == 'release'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" dist/*.zip

      - name: Keep zip as artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: dist/*.zip
